<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Wyszukiwarka produktów</title>
</head>
<body>

    <h1>Produkty</h1>

    <input type="text" id="szukaj" placeholder="Szukaj produktu">

    <ul id="lista1"></ul>

    <script>
        function debounce(fn, delay) {
            let timer;

            return function() {
                clearTimeout(timer);

                timer = setTimeout(function() {
                    fn();
                }, delay);
            };
        }

        let szukaj = document.querySelector("#szukaj");
        let lista1 = document.querySelector("#lista1");
        let kontroler = null;

        async function szukajProduktow() {
            if (kontroler !== null) {
                kontroler.abort();
            }

            kontroler = new AbortController();

            try {
                let response = await fetch(
                    "produkty.php?szukaj=" + encodeURIComponent(szukaj.value),
                    { signal: kontroler.signal }
                );

                if (!response.ok) {
                    throw new Error("Błąd pobierania danych");
                }

                let dane = await response.json();

                let fragment = document.createDocumentFragment();

                dane.forEach(function(produkt) {
                    let li = document.createElement("li");
                    li.textContent = produkt.nazwa;
                    fragment.appendChild(li);
                });

                lista1.innerHTML = "";
                lista1.appendChild(fragment);

            } catch (blad) {
                if (blad.name !== "AbortError") {
                    console.log("Wystąpił błąd:", blad);
                }
            }
        }

        szukaj.addEventListener("input", debounce(szukajProduktow, 400));
    </script>

</body>
</html>
